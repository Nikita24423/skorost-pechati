<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скорость печати</title>
  <style>
    :root {
      --bg0: #eef2f4;
      --bg1: #f7f9fa;
      --ink: #1a2329;
      --muted: #8a969e;
      --typed: #3d6b5a;
      --current: #c45c26;
      --current-bg: rgba(196, 92, 38, 0.14);
      --error-flash: #c62828;
      --panel: rgba(255, 255, 255, 0.72);
      --border: rgba(26, 35, 41, 0.08);
      --shadow: 0 18px 50px rgba(26, 35, 41, 0.08);
      --accent-btn: #1a2329;
      --accent-btn-text: #f7f9fa;
      --font-ui: "Segoe UI", "Helvetica Neue", sans-serif;
      --font-text: "Georgia", "Times New Roman", serif;

      --f-lp: #d64545;
      --f-lr: #e07b39;
      --f-lm: #d4a017;
      --f-li: #3d8b6e;
      --f-th: #2f6f8f;
      --f-ri: #3a7ca5;
      --f-rm: #5b8c5a;
      --f-rr: #c97b63;
      --f-rp: #7a6f9b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font-ui);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, #d9e7ea 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e8ddd4 0%, transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 16px 48px;
    }

    .app {
      width: min(1040px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 32px 36px 28px;
      animation: rise 0.55s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 1.7rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .lang-switch {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--border);
    }

    .lang-btn {
      padding: 6px 14px !important;
      font-size: 0.85rem !important;
      background: transparent !important;
      color: var(--muted) !important;
      border-radius: 999px !important;
    }

    .lang-btn.active {
      background: var(--accent-btn) !important;
      color: var(--accent-btn-text) !important;
    }

    .progress {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress strong {
      color: var(--ink);
      font-weight: 650;
    }

    .subtitle { display: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .stage {
      position: relative;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      transition: box-shadow 0.15s ease, background 0.15s ease;
    }

    .stage.flash-error {
      box-shadow: inset 0 0 0 2px rgba(198, 40, 40, 0.35);
      background: rgba(198, 40, 40, 0.05);
    }

    .line {
      font-family: var(--font-text);
      font-size: clamp(1.55rem, 3.2vw, 2.15rem);
      line-height: 1.55;
      letter-spacing: 0.01em;
      text-align: center;
      word-break: break-word;
      max-width: 100%;
    }

    .char { display: inline; white-space: pre-wrap; }
    .char.typed { color: var(--typed); }
    .char.current {
      color: var(--current);
      background: var(--current-bg);
      border-radius: 4px;
      padding: 0 1px;
      box-shadow: 0 2px 0 rgba(196, 92, 38, 0.35);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .char.current.space::before { content: "·"; opacity: 0.55; }
    .char.rest { color: var(--muted); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 2px 0 rgba(196, 92, 38, 0.35); }
      50% { box-shadow: 0 2px 0 rgba(196, 92, 38, 0.75); }
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 18px;
      min-height: 1.3em;
    }

    .guide {
      margin-top: 8px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .guide-head {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 12px;
      min-height: 37px;
    }

    .guide-actions {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      min-height: 37px;
    }

    .guide-actions-clip {
      display: grid;
      grid-template-columns: 1fr;
      min-width: 0;
      transition: grid-template-columns 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .guide-actions.collapsed .guide-actions-clip {
      grid-template-columns: 0fr;
    }

    .guide-actions-panel {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      opacity: 1;
      transform: translateX(0);
      transition:
        opacity 0.22s ease,
        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .guide-actions.collapsed .guide-actions-panel {
      opacity: 0;
      transform: translateX(18px);
      pointer-events: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 8px 14px;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .btn-collapse {
      flex-shrink: 0;
      width: 37px;
      height: 37px;
      padding: 0 !important;
      border-radius: 10px !important;
      background: #3d8b6e !important;
      color: #fff !important;
      border: 1px solid transparent;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .btn-collapse .arrow-icon {
      width: 22px;
      height: 22px;
      display: block;
      flex-shrink: 0;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-collapse:hover {
      opacity: 0.92;
      transform: scale(1.04);
    }

    .guide-actions.collapsed .btn-collapse {
      transform: none;
      background: #fff !important;
      color: #3d8b6e !important;
      border-color: rgba(61, 139, 110, 0.45);
    }

    .guide-actions.collapsed .btn-collapse .arrow-icon {
      transform: rotate(180deg);
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: none;
      margin-bottom: 18px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .kb-row.offset-1 { padding-left: 18px; }
    .kb-row.offset-2 { padding-left: 36px; }

    .key {
      --key-color: transparent;
      min-width: 42px;
      height: 42px;
      padding: 0 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background:
        linear-gradient(var(--key-color), var(--key-color)),
        rgba(255, 255, 255, 0.85);
      color: var(--ink);
      font: 600 0.92rem/1 var(--font-ui);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      box-shadow: 0 1px 0 rgba(26, 35, 41, 0.06);
    }

    .key:hover { transform: translateY(-1px); }
    .key.wide { min-width: 64px; font-size: 0.78rem; color: var(--muted); }
    .key.space {
      min-width: min(420px, 58vw);
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .key.mapped {
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);
      border-color: transparent;
    }

    /* Рамка только у домашних клавиш А и О */
    .key.home-key {
      border: 2px solid #f0c419;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 0 2px rgba(240, 196, 25, 0.35);
    }

    .key.home-key.mapped {
      border-color: #f0c419;
    }

    .key.target {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(196, 92, 38, 0.22);
      z-index: 1;
    }

    .key.home-key.target {
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 0 4px rgba(196, 92, 38, 0.22);
    }

    .key.pressed {
      transform: translateY(1px);
      filter: brightness(0.92);
    }

    .hands-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hands {
      width: min(720px, 100%);
      height: auto;
      display: block;
    }

    .finger {
      cursor: pointer;
      transition: filter 0.15s ease, opacity 0.15s ease;
      stroke: rgba(26, 35, 41, 0.35);
      stroke-width: 1.5;
    }

    .finger:hover { filter: brightness(1.08); }
    .finger.selected {
      stroke: var(--ink);
      stroke-width: 3;
      filter: drop-shadow(0 0 6px rgba(26, 35, 41, 0.25));
    }
    .finger.active-target {
      filter: drop-shadow(0 0 8px rgba(196, 92, 38, 0.55));
      stroke: var(--current);
      stroke-width: 3;
    }

    .palm {
      fill: #e7d7c7;
      stroke: rgba(26, 35, 41, 0.2);
      stroke-width: 1.5;
    }

    .finger-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 720px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.45);
    }

    .legend-item.selected {
      border-color: var(--ink);
      color: var(--ink);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      border-radius: 999px;
      padding: 12px 22px;
      background: var(--accent-btn);
      color: var(--accent-btn-text);
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:hover { opacity: 0.92; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible {
      outline: 2px solid var(--current);
      outline-offset: 3px;
    }

    .hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      left: -9999px;
    }

    .summary {
      display: none;
      text-align: center;
      animation: rise 0.45s ease both;
    }

    .summary.visible { display: block; }

    .summary h2 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }

    .summary p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 26px;
      text-align: left;
    }

    .summary-grid .stat { background: rgba(255, 255, 255, 0.7); }

    .typing-area.hidden,
    .stats.hidden,
    .hint.hidden,
    header .progress.hidden {
      display: none;
    }

    @media (max-width: 820px) {
      .app { padding: 22px 14px 18px; border-radius: 16px; }
      header { flex-direction: column; gap: 8px; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .key { min-width: 30px; height: 34px; font-size: 0.78rem; border-radius: 6px; }
      .key.wide { min-width: 46px; }
      .kb-row { gap: 3px; }
      .kb-row.offset-1 { padding-left: 10px; }
      .kb-row.offset-2 { padding-left: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Скорость печати🤖</h1>
      </div>
      <div class="header-right">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Язык">
          <button type="button" class="lang-btn active" data-lang="ru" id="langRu">RU</button>
          <button type="button" class="lang-btn" data-lang="en" id="langEn">EN</button>
        </div>
        <div class="progress" id="progress">Строка <strong>1</strong> / 15</div>
      </div>
    </header>

    <section class="stats" id="stats">
      <div class="stat">
        <span class="stat-label">Верные</span>
        <div class="stat-value" id="statCorrect">0</div>
      </div>
      <div class="stat">
        <span class="stat-label">Ошибки</span>
        <div class="stat-value" id="statErrors">0</div>
      </div>
      <div class="stat">
        <span class="stat-label">Точность</span>
        <div class="stat-value" id="statAccuracy">100%</div>
      </div>
      <div class="stat">
        <span class="stat-label">Скорость</span>
        <div class="stat-value" id="statSpeed">0 зн/мин</div>
      </div>
      <div class="stat">
        <span class="stat-label">Нажато</span>
        <div class="stat-value" id="statPressed">—</div>
      </div>
    </section>

    <div class="typing-area" id="typingArea">
      <div class="stage" id="stage" tabindex="0" role="textbox" aria-label="Поле для набора текста" aria-live="polite">
        <div class="line" id="line"></div>
      </div>
      <p class="hint" id="hint">Начните печатать — переход только после верного символа</p>
    </div>

    <section class="summary" id="summary" aria-live="polite">
      <h2>Упражнение завершено</h2>
      <p>Все строки пройдены. Вот ваш результат.</p>
      <div class="summary-grid">
        <div class="stat">
          <span class="stat-label">Точность</span>
          <div class="stat-value" id="sumAccuracy">—</div>
        </div>
        <div class="stat">
          <span class="stat-label">Ошибки</span>
          <div class="stat-value" id="sumErrors">—</div>
        </div>
        <div class="stat">
          <span class="stat-label">Среднее время на символ</span>
          <div class="stat-value" id="sumAvg">—</div>
        </div>
        <div class="stat">
          <span class="stat-label">Скорость</span>
          <div class="stat-value" id="sumSpeed">—</div>
        </div>
      </div>
    </section>

    <section class="guide" id="guide" aria-label="Клавиатура и пальцы">
      <div class="guide-head">
        <div class="guide-actions" id="guideActions">
          <div class="guide-actions-clip">
            <div class="guide-actions-panel" id="guideActionsPanel">
              <button type="button" class="btn-secondary" id="saveMapBtn" data-mode="save">Сохранить</button>
              <button type="button" class="btn-secondary" id="defaultMapBtn">Разметка по умолчанию</button>
              <button type="button" class="btn-secondary" id="clearMapBtn">Сбросить разметку</button>
            </div>
          </div>
          <button type="button" class="btn-collapse" id="collapseActionsBtn" title="Свернуть" aria-label="Свернуть кнопки">
            <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M9.3 4.7a1 1 0 0 0 0 1.4L15.2 12l-5.9 5.9a1 1 0 1 0 1.4 1.4l6.6-6.6a1 1 0 0 0 0-1.4L10.7 4.7a1 1 0 0 0-1.4 0z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="keyboard" id="keyboard" aria-label="Русская клавиатура"></div>

      <div class="hands-wrap">
        <svg class="hands" id="hands" viewBox="0 0 720 260" role="img" aria-label="Схема пальцев">
          <!-- Левая рука -->
          <path class="palm" d="M70 150c8-42 38-70 88-78 28-4 58 2 78 22 14 14 22 34 24 56v70H78c-8-18-12-40-8-70z" />
          <path class="finger" data-finger="lp" fill="var(--f-lp)" d="M78 148c-2-46 4-88 18-108 8-10 22-10 28 2 6 14 4 48 2 78l-4 48H84z" />
          <path class="finger" data-finger="lr" fill="var(--f-lr)" d="M118 120c0-52 6-96 20-118 8-12 24-10 28 4 6 18 4 58 2 92l-4 62h-40z" />
          <path class="finger" data-finger="lm" fill="var(--f-lm)" d="M160 112c2-58 8-108 22-128 8-12 24-10 28 4 6 20 4 64 2 100l-4 66h-42z" />
          <path class="finger" data-finger="li" fill="var(--f-li)" d="M204 128c4-48 12-88 26-104 8-10 24-8 28 6 4 16 2 52 0 82l-4 52h-42z" />
          <path class="finger" data-finger="th" fill="var(--f-th)" d="M248 176c28-8 54 4 62 28 6 18-2 36-20 42-22 8-48 2-62-18-8-12-8-34 0-52 4-8 12-12 20-0z" transform="rotate(-18 260 190)" />

          <!-- Правая рука -->
          <path class="palm" d="M650 150c-8-42-38-70-88-78-28-4-58 2-78 22-14 14-22 34-24 56v70h182c8-18 12-40 8-70z" />
          <path class="finger" data-finger="rp" fill="var(--f-rp)" d="M642 148c2-46-4-88-18-108-8-10-22-10-28 2-6 14-4 48-2 78l4 48h34z" />
          <path class="finger" data-finger="rr" fill="var(--f-rr)" d="M602 120c0-52-6-96-20-118-8-12-24-10-28 4-6 18-4 58-2 92l4 62h40z" />
          <path class="finger" data-finger="rm" fill="var(--f-rm)" d="M560 112c-2-58-8-108-22-128-8-12-24-10-28 4-6 20-4 64-2 100l4 66h42z" />
          <path class="finger" data-finger="ri" fill="var(--f-ri)" d="M516 128c-4-48-12-88-26-104-8-10-24-8-28 6-4 16-2 52 0 82l4 52h42z" />
          <path class="finger" data-finger="th" fill="var(--f-th)" d="M472 176c-28-8-54 4-62 28-6 18 2 36 20 42 22 8 48 2 62-18 8-12 8-34 0-52-4-8-12-12-20 0z" transform="rotate(18 460 190)" />
        </svg>

        <div class="finger-legend" id="fingerLegend"></div>
      </div>
    </section>

    <div class="actions">
      <button type="button" id="restartBtn">Начать заново</button>
    </div>

    <input
      class="hidden-input"
      id="hiddenInput"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-hidden="true"
    />
  </main>

  <script src="phrases.js"></script>
  <script src="phrases-en.js"></script>
  <script>
    // Фразы: node generate-phrases.js → phrases.js + phrases-en.js
    const PHRASES = {
      ru: Array.isArray(window.TYPING_LINES_RU) ? window.TYPING_LINES_RU : (window.TYPING_LINES || []),
      en: Array.isArray(window.TYPING_LINES_EN) ? window.TYPING_LINES_EN : [],
    };

    // е и ё считаются одинаковыми при вводе (только RU)
    function normalizeYe(ch) {
      return ch === "ё" || ch === "Ё" ? "е" : ch;
    }

    function charsMatch(a, b) {
      if (state.lang === "en") {
        return a.toLowerCase() === b.toLowerCase();
      }
      if (a === b) return true;
      return normalizeYe(a) === normalizeYe(b);
    }

    function yeVariants(ch) {
      // на раскладке нет ё — подсвечиваем е
      if (state.lang === "ru" && (ch === "е" || ch === "ё")) return ["е"];
      return [ch];
    }

    const FINGERS = [
      { id: "lp", label: "Л мизинец", color: "var(--f-lp)" },
      { id: "lr", label: "Л безымянный", color: "var(--f-lr)" },
      { id: "lm", label: "Л средний", color: "var(--f-lm)" },
      { id: "li", label: "Л указательный", color: "var(--f-li)" },
      { id: "th", label: "Большие", color: "var(--f-th)" },
      { id: "ri", label: "П указательный", color: "var(--f-ri)" },
      { id: "rm", label: "П средний", color: "var(--f-rm)" },
      { id: "rr", label: "П безымянный", color: "var(--f-rr)" },
      { id: "rp", label: "П мизинец", color: "var(--f-rp)" },
    ];

    const FINGER_COLOR = Object.fromEntries(
      FINGERS.map((f) => [f.id, getComputedStyle(document.documentElement).getPropertyValue(
        ({
          lp: "--f-lp", lr: "--f-lr", lm: "--f-lm", li: "--f-li", th: "--f-th",
          ri: "--f-ri", rm: "--f-rm", rr: "--f-rr", rp: "--f-rp",
        })[f.id]
      ).trim() || f.color])
    );

    // Fallback solid colors for inline styles
    const FINGER_HEX = {
      lp: "#d64545",
      lr: "#e07b39",
      lm: "#d4a017",
      li: "#3d8b6e",
      th: "#2f6f8f",
      ri: "#3a7ca5",
      rm: "#5b8c5a",
      rr: "#c97b63",
      rp: "#7a6f9b",
    };

    const KB_LAYOUTS = {
      ru: [
        { keys: ["й", "ц", "у", "к", "е", "н", "г", "ш", "щ", "з", "х", "ъ"], offset: "" },
        { keys: ["ф", "ы", "в", "а", "п", "р", "о", "л", "д", "ж", "э"], offset: "offset-1" },
        { keys: ["я", "ч", "с", "м", "и", "т", "ь", "б", "ю", "."], offset: "offset-2" },
        { keys: [" "], offset: "", special: true },
      ],
      en: [
        { keys: ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"], offset: "" },
        { keys: ["a", "s", "d", "f", "g", "h", "j", "k", "l"], offset: "offset-1" },
        { keys: ["z", "x", "c", "v", "b", "n", "m", "."], offset: "offset-2" },
        { keys: [" "], offset: "", special: true },
      ],
    };

    const HOME_KEYS = {
      ru: ["а", "о"],
      en: ["f", "j"],
    };

    // Разметка по умолчанию — текущая с экрана (без ё)
    const DEFAULT_KEY_MAPS = {
      ru: {
        й: "lp", ц: "lp", ф: "lp",
        ы: "lr", я: "lr",
        у: "lm", к: "lm", в: "lm", ч: "lm",
        е: "li", а: "li", п: "li", с: "li", м: "li",
        н: "ri", г: "ri", р: "ri", о: "ri", и: "ri", т: "ri", ь: "ri",
        ш: "rm", л: "rm", б: "rm",
        щ: "rr", д: "rr", ю: "rr",
        з: "rp", х: "rp", ъ: "rp", ж: "rp", э: "rp", ".": "rp",
        " ": "th",
      },
      en: {
        q: "lp", a: "lp", z: "lp",
        w: "lr", s: "lr", x: "lr",
        e: "lm", d: "lm", c: "lm",
        r: "li", f: "li", v: "li", t: "li", g: "li", b: "li",
        y: "ri", h: "ri", n: "ri", u: "ri", j: "ri", m: "ri",
        i: "rm", k: "rm",
        o: "rr", l: "rr",
        p: "rp", ".": "rp",
        " ": "th",
      },
    };

    function defaultKeyMap(lang) {
      return Object.assign({}, DEFAULT_KEY_MAPS[lang] || DEFAULT_KEY_MAPS.ru);
    }

    const els = {
      line: document.getElementById("line"),
      stage: document.getElementById("stage"),
      progress: document.getElementById("progress"),
      hint: document.getElementById("hint"),
      stats: document.getElementById("stats"),
      typingArea: document.getElementById("typingArea"),
      summary: document.getElementById("summary"),
      restartBtn: document.getElementById("restartBtn"),
      hiddenInput: document.getElementById("hiddenInput"),
      statCorrect: document.getElementById("statCorrect"),
      statErrors: document.getElementById("statErrors"),
      statAccuracy: document.getElementById("statAccuracy"),
      statSpeed: document.getElementById("statSpeed"),
      statPressed: document.getElementById("statPressed"),
      sumAccuracy: document.getElementById("sumAccuracy"),
      sumErrors: document.getElementById("sumErrors"),
      sumAvg: document.getElementById("sumAvg"),
      sumSpeed: document.getElementById("sumSpeed"),
      keyboard: document.getElementById("keyboard"),
      hands: document.getElementById("hands"),
      fingerLegend: document.getElementById("fingerLegend"),
      clearMapBtn: document.getElementById("clearMapBtn"),
      saveMapBtn: document.getElementById("saveMapBtn"),
      defaultMapBtn: document.getElementById("defaultMapBtn"),
      guideActions: document.getElementById("guideActions"),
      collapseActionsBtn: document.getElementById("collapseActionsBtn"),
      guide: document.getElementById("guide"),
      langRu: document.getElementById("langRu"),
      langEn: document.getElementById("langEn"),
    };

    const state = {
      lang: localStorage.getItem("skorost-pechati-lang") === "en" ? "en" : "ru",
      lineIndex: 0,
      charIndex: 0,
      correct: 0,
      errors: 0,
      startedAt: null,
      finished: false,
      flashTimer: null,
      speedTimer: null,
      handledByKeydown: false,
      selectedFinger: null,
      keyMap: {},
      keyEls: new Map(),
      lastPressed: null,
      queue: [],
    };

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function reshuffleQueue() {
      state.queue = shuffle(PHRASES[state.lang] || []);
    }

    function lines() {
      return state.queue.length ? state.queue : (PHRASES[state.lang] || []);
    }

    async function loadKeyMapFromDisk() {
      const res = await fetch("/api/keymap/" + state.lang, { cache: "no-store" });
      const text = await res.text();
      let data = {};
      try {
        data = JSON.parse(text);
      } catch (_) {
        throw new Error("bad_response");
      }
      if (!res.ok || !data.ok || !data.map || typeof data.map !== "object") {
        throw new Error((data && data.error) || "not_found");
      }
      return data.map;
    }

    async function loadKeyMap() {
      try {
        return await loadKeyMapFromDisk();
      } catch (_) {
        return defaultKeyMap(state.lang);
      }
    }

    async function saveKeyMapToDisk() {
      const res = await fetch("/api/keymap/" + state.lang, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({ map: state.keyMap }),
      });
      const text = await res.text();
      let data = {};
      try {
        data = JSON.parse(text);
      } catch (_) {
        throw new Error(res.ok ? "bad_response" : "http_" + res.status);
      }
      if (!res.ok || !data.ok) {
        throw new Error((data && data.error) || ("http_" + res.status));
      }
      return data.file || ("data/keymap-" + state.lang + ".json");
    }

    function setSaveBtnMode(mode) {
      const btn = els.saveMapBtn;
      btn.dataset.mode = mode;
      btn.textContent = mode === "show" ? "Показать" : "Сохранить";
    }

    function flashBtn(btn, text, restoreMode) {
      if (!btn) return;
      const prev = btn.textContent;
      btn.textContent = text;
      clearTimeout(btn._flashTimer);
      btn._flashTimer = setTimeout(() => {
        if (restoreMode) setSaveBtnMode(restoreMode);
        else btn.textContent = prev;
      }, 1200);
    }

    function currentLine() {
      return lines()[state.lineIndex] || "";
    }

    function expectedChar() {
      return currentLine()[state.charIndex] || "";
    }

    function accuracy() {
      const total = state.correct + state.errors;
      if (total === 0) return 100;
      return (state.correct / total) * 100;
    }

    function speedCpm() {
      if (!state.startedAt || state.correct === 0) return 0;
      const minutes = (Date.now() - state.startedAt) / 60000;
      if (minutes <= 0) return 0;
      return state.correct / minutes;
    }

    function formatPercent(value) {
      return (Math.round(value * 10) / 10).toFixed(value % 1 === 0 ? 0 : 1) + "%";
    }

    function formatSpeed(value) {
      return Math.round(value) + " зн/мин";
    }

    function formatAvgMs() {
      if (!state.startedAt || state.correct === 0) return "—";
      const ms = (Date.now() - state.startedAt) / state.correct;
      if (ms >= 1000) return (ms / 1000).toFixed(2) + " с";
      return Math.round(ms) + " мс";
    }

    function buildKeyboard() {
      els.keyboard.replaceChildren();
      state.keyEls.clear();
      const rows = KB_LAYOUTS[state.lang] || KB_LAYOUTS.ru;
      const homes = HOME_KEYS[state.lang] || [];
      els.keyboard.setAttribute("aria-label", state.lang === "en" ? "English keyboard" : "Русская клавиатура");

      rows.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "kb-row" + (row.offset ? " " + row.offset : "");

        row.keys.forEach((ch) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "key";
          btn.dataset.key = ch;

          if (ch === " ") {
            btn.classList.add("space");
            btn.textContent = state.lang === "en" ? "space" : "пробел";
          } else if (ch === ".") {
            btn.classList.add("wide");
            btn.textContent = ".";
            btn.title = state.lang === "en"
              ? "Period key — not used in exercises"
              : "Точка — на клавиатуре есть, в упражнении не используется";
          } else {
            btn.textContent = ch;
          }

          if (homes.includes(ch)) {
            btn.classList.add("home-key");
            btn.title = state.lang === "en" ? "Home position" : "Домашняя позиция";
          }

          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            onKeyPaint(ch);
          });

          btn.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            e.stopPropagation();
            delete state.keyMap[ch];
            paintKey(btn, ch);
            highlightTargetKey();
          });

          rowEl.appendChild(btn);
          state.keyEls.set(ch, btn);
        });

        els.keyboard.appendChild(rowEl);
      });

      refreshKeyColors();
    }

    function paintKey(btn, ch) {
      const finger = state.keyMap[ch];
      if (finger && FINGER_HEX[finger]) {
        btn.classList.add("mapped");
        btn.style.setProperty("--key-color", FINGER_HEX[finger]);
        btn.style.background = FINGER_HEX[finger];
      } else {
        btn.classList.remove("mapped");
        btn.style.removeProperty("--key-color");
        btn.style.background = "";
      }
    }

    function refreshKeyColors() {
      state.keyEls.forEach((btn, ch) => paintKey(btn, ch));
      highlightTargetKey();
    }

    function onKeyPaint(ch) {
      if (!state.selectedFinger) return;

      if (state.keyMap[ch] === state.selectedFinger) {
        delete state.keyMap[ch];
      } else {
        state.keyMap[ch] = state.selectedFinger;
      }

      setSaveBtnMode("save");
      const btn = state.keyEls.get(ch);
      if (btn) paintKey(btn, ch);
      highlightTargetKey();
    }

    function selectFinger(id) {
      state.selectedFinger = state.selectedFinger === id ? null : id;

      els.hands.querySelectorAll(".finger").forEach((el) => {
        el.classList.toggle("selected", el.dataset.finger === state.selectedFinger);
      });

      els.fingerLegend.querySelectorAll(".legend-item").forEach((el) => {
        el.classList.toggle("selected", el.dataset.finger === state.selectedFinger);
      });
    }

    function buildLegend() {
      els.fingerLegend.replaceChildren();
      FINGERS.forEach((f) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "legend-item";
        item.dataset.finger = f.id;

        const swatch = document.createElement("span");
        swatch.className = "legend-swatch";
        swatch.style.background = FINGER_HEX[f.id];

        const label = document.createElement("span");
        label.textContent = f.label;

        item.append(swatch, label);
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          selectFinger(f.id);
        });
        els.fingerLegend.appendChild(item);
      });
    }

    function highlightTargetKey() {
      state.keyEls.forEach((btn) => btn.classList.remove("target"));
      els.hands.querySelectorAll(".finger").forEach((el) => el.classList.remove("active-target"));

      if (state.finished) return;

      const ch = expectedChar();
      yeVariants(ch).forEach((variant) => {
        const btn = state.keyEls.get(variant);
        if (btn) btn.classList.add("target");
      });

      const finger =
        state.keyMap[ch] ||
        (ch === "е" ? state.keyMap["ё"] : null) ||
        (ch === "ё" ? state.keyMap["е"] : null);

      if (finger) {
        els.hands.querySelectorAll('.finger[data-finger="' + finger + '"]').forEach((el) => {
          el.classList.add("active-target");
        });
      }
    }

    function flashKeyPress(ch) {
      yeVariants(ch).forEach((variant) => {
        const btn = state.keyEls.get(variant);
        if (!btn) return;
        btn.classList.add("pressed");
        setTimeout(() => btn.classList.remove("pressed"), 100);
      });
    }

    function renderLine() {
      const text = currentLine();
      const frag = document.createDocumentFragment();

      for (let i = 0; i < text.length; i++) {
        const span = document.createElement("span");
        span.className = "char";
        const ch = text[i];
        span.textContent = ch;

        if (i < state.charIndex) {
          span.classList.add("typed");
        } else if (i === state.charIndex) {
          span.classList.add("current");
          if (ch === " ") span.classList.add("space");
        } else {
          span.classList.add("rest");
        }

        frag.appendChild(span);
      }

      els.line.replaceChildren(frag);
      highlightTargetKey();
    }

    function renderProgress() {
      const total = lines().length;
      els.progress.innerHTML =
        "Строка <strong>" +
        Math.min(state.lineIndex + 1, total || 1) +
        "</strong> / " +
        total;
    }

    function formatPressed(ch) {
      if (!ch) return "—";
      if (ch === " ") return "␣";
      return ch;
    }

    function renderStats() {
      els.statCorrect.textContent = String(state.correct);
      els.statErrors.textContent = String(state.errors);
      els.statAccuracy.textContent = formatPercent(accuracy());
      els.statSpeed.textContent = formatSpeed(speedCpm());
      els.statPressed.textContent = formatPressed(state.lastPressed);
    }

    function flashError() {
      els.stage.classList.add("flash-error");
      clearTimeout(state.flashTimer);
      state.flashTimer = setTimeout(() => {
        els.stage.classList.remove("flash-error");
      }, 140);
    }

    function focusInput() {
      try {
        els.hiddenInput.focus({ preventScroll: true });
      } catch (_) {
        els.hiddenInput.focus();
      }
    }

    function showSummary() {
      state.finished = true;
      clearInterval(state.speedTimer);

      els.typingArea.classList.add("hidden");
      els.stats.classList.add("hidden");
      els.hint.classList.add("hidden");
      els.progress.classList.add("hidden");
      els.summary.classList.add("visible");

      els.sumAccuracy.textContent = formatPercent(accuracy());
      els.sumErrors.textContent = String(state.errors);
      els.sumAvg.textContent = formatAvgMs();
      els.sumSpeed.textContent = formatSpeed(speedCpm());
      els.hint.textContent = "";
      highlightTargetKey();
    }

    function advanceLineOrFinish() {
      if (state.lineIndex >= lines().length - 1) {
        showSummary();
        return;
      }

      state.lineIndex += 1;
      state.charIndex = 0;
      renderProgress();
      renderLine();
      els.hint.textContent = "Строка завершена — продолжайте со следующей";
      setTimeout(() => {
        if (!state.finished) {
          els.hint.textContent = "Начните печатать — переход только после верного символа";
        }
      }, 900);
    }

    function acceptChar(ch) {
      state.correct += 1;
      state.charIndex += 1;
      flashKeyPress(ch);
      renderStats();

      if (state.charIndex >= currentLine().length) {
        advanceLineOrFinish();
      } else {
        renderLine();
      }
    }

    function isPrintableKey(event) {
      if (event.ctrlKey || event.metaKey || event.altKey) return false;
      if (event.key === "Dead") return false;
      if (event.key.length !== 1) return false;
      return true;
    }

    function onKeyDown(event) {
      if (state.finished) return;
      if (event.ctrlKey || event.metaKey || event.altKey) return;

      if (
        event.key === "Backspace" ||
        event.key === "Delete" ||
        event.key === "Tab" ||
        event.key === "Escape" ||
        event.key === "Enter" ||
        event.key === "Shift" ||
        event.key === "CapsLock" ||
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight" ||
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.key === "Process"
      ) {
        if (event.key === "Tab") event.preventDefault();
        return;
      }

      if (!isPrintableKey(event)) return;

      event.preventDefault();
      state.handledByKeydown = true;
      queueMicrotask(() => {
        state.handledByKeydown = false;
      });

      handleTypedChar(event.key);
    }

    function ensureTimer() {
      if (!state.startedAt) {
        state.startedAt = Date.now();
        state.speedTimer = setInterval(renderStats, 250);
      }
    }

    function handleTypedChar(typed) {
      ensureTimer();
      const key = state.lang === "en" ? typed.toLowerCase() : typed;
      state.lastPressed = key;
      renderStats();

      if (charsMatch(key, expectedChar())) {
        acceptChar(key);
      } else {
        state.errors += 1;
        renderStats();
        flashError();
      }
    }

    function updateLangButtons() {
      els.langRu.classList.toggle("active", state.lang === "ru");
      els.langEn.classList.toggle("active", state.lang === "en");
    }

    async function setLang(lang) {
      if (lang !== "ru" && lang !== "en") return;
      state.lang = lang;
      localStorage.setItem("skorost-pechati-lang", lang);
      state.keyMap = await loadKeyMap();
      state.selectedFinger = null;
      els.hands.querySelectorAll(".finger").forEach((el) => el.classList.remove("selected"));
      els.fingerLegend.querySelectorAll(".legend-item").forEach((el) => el.classList.remove("selected"));
      updateLangButtons();
      buildKeyboard();
      reset();
    }

    function reset() {
      clearInterval(state.speedTimer);
      clearTimeout(state.flashTimer);

      reshuffleQueue();
      state.lineIndex = 0;
      state.charIndex = 0;
      state.correct = 0;
      state.errors = 0;
      state.startedAt = null;
      state.finished = false;
      state.flashTimer = null;
      state.speedTimer = null;
      state.lastPressed = null;

      els.typingArea.classList.remove("hidden");
      els.stats.classList.remove("hidden");
      els.hint.classList.remove("hidden");
      els.progress.classList.remove("hidden");
      els.summary.classList.remove("visible");
      els.stage.classList.remove("flash-error");
      els.hint.textContent = state.lang === "en"
        ? "Start typing — advance only after the correct character"
        : "Начните печатать — переход только после верного символа";

      renderProgress();
      renderLine();
      renderStats();
      focusInput();
    }

    els.restartBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      reset();
    });

    els.langRu.addEventListener("click", (e) => {
      e.stopPropagation();
      setLang("ru");
    });

    els.langEn.addEventListener("click", (e) => {
      e.stopPropagation();
      setLang("en");
    });

    els.saveMapBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const mode = els.saveMapBtn.dataset.mode || "save";

      if (mode === "show") {
        try {
          state.keyMap = await loadKeyMapFromDisk();
          refreshKeyColors();
          flashBtn(els.saveMapBtn, "Показано", "save");
        } catch (_) {
          flashBtn(els.saveMapBtn, "Нет файла", "show");
        }
        return;
      }

      try {
        await saveKeyMapToDisk();
        flashBtn(els.saveMapBtn, "Сохранено", "show");
      } catch (_) {
        flashBtn(els.saveMapBtn, "Ошибка", "save");
      }
    });

    els.defaultMapBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      state.keyMap = defaultKeyMap(state.lang);
      refreshKeyColors();
      setSaveBtnMode("save");
    });

    els.clearMapBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      state.keyMap = {};
      refreshKeyColors();
      setSaveBtnMode("save");
    });

    function setCollapseArrow(collapsed) {
      els.collapseActionsBtn.title = collapsed ? "Развернуть" : "Свернуть";
      els.collapseActionsBtn.setAttribute("aria-label", collapsed ? "Развернуть кнопки" : "Свернуть кнопки");
    }

    els.collapseActionsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const collapsed = els.guideActions.classList.toggle("collapsed");
      setCollapseArrow(collapsed);
      localStorage.setItem("skorost-pechati-actions-collapsed", collapsed ? "1" : "0");
    });

    if (localStorage.getItem("skorost-pechati-actions-collapsed") === "1") {
      els.guideActions.classList.add("collapsed");
      setCollapseArrow(true);
    }

    els.hands.querySelectorAll(".finger").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        selectFinger(el.dataset.finger);
      });
    });

    els.stage.addEventListener("click", (e) => {
      e.stopPropagation();
      focusInput();
    });

    els.guide.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    document.addEventListener("click", (e) => {
      if (
        e.target.closest("#guide") ||
        e.target.closest("#restartBtn") ||
        e.target.closest("#clearMapBtn") ||
        e.target.closest("#saveMapBtn") ||
        e.target.closest("#defaultMapBtn") ||
        e.target.closest("#collapseActionsBtn") ||
        e.target.closest("#langSwitch")
      ) {
        return;
      }
      if (!state.finished) focusInput();
    });

    window.addEventListener("keydown", onKeyDown);

    els.hiddenInput.addEventListener("input", () => {
      const value = els.hiddenInput.value;
      els.hiddenInput.value = "";
      if (!value || state.finished || state.handledByKeydown) return;
      handleTypedChar(value.slice(-1));
    });

    (async function init() {
      state.keyMap = await loadKeyMap();
      updateLangButtons();
      buildLegend();
      buildKeyboard();
      reset();
    })();
  </script>
</body>
</html>
